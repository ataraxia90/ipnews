name: Run IP Monitor

on:
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUTF8: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DIGEST_PARENT_PAGE_ID: ${{ secrets.NOTION_DIGEST_PARENT_PAGE_ID }}
      NOTION_REVIEW_PARENT_PAGE_ID: ${{ secrets.NOTION_REVIEW_PARENT_PAGE_ID }}
      NOTION_DASHBOARD_PARENT_PAGE_ID: ${{ secrets.NOTION_DASHBOARD_PARENT_PAGE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run monitor
        run: python monitor.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-monitor-output
          path: |
            data/raw_articles.json
            data/results.json
            data/daily_results/*.json
            data/sent_digest_topics.json
            data/source_check_report.json
            data/telegram_digest.txt
            data/telegram_raw_review.txt
            data/failed_sources.yaml
            data/notion_pages.json
            data/run_logs/*.json
          if-no-files-found: ignore
