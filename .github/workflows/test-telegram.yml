name: Test Telegram Delivery

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}

    steps:
      - name: Send test messages
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          import json

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          targets = [
              ("review", os.environ.get("TELEGRAM_REVIEW_CHAT_ID")),
              ("digest", os.environ.get("TELEGRAM_DIGEST_CHAT_ID")),
          ]

          if not token:
              print("Missing TELEGRAM_BOT_TOKEN")
              sys.exit(1)

          missing = [name for name, chat_id in targets if not chat_id]
          if missing:
              print("Missing chat id secret(s): " + ", ".join(missing))
              sys.exit(1)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for name, chat_id in targets:
              text = (
                  f"IP Monitor Telegram {name} channel delivery test from GitHub Actions\n"
                  f"{time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}"
              )
              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": True,
              }).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      print(name, resp.status)
                      print(body)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(name, e.code)
                  print(body)
                  sys.exit(1)
              except Exception as e:
                  print(name, type(e).__name__, str(e))
                  sys.exit(1)
          PY
