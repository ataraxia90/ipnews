project:
  name: ip-policy-monitor-mvp
  timezone: Asia/Seoul
  language: ko

fetch:
  user_agent: Mozilla/5.0 IP-Monitor-MVP
  timeout_seconds: 20
  dedupe_by: url
  stale_article_days: 14

schedule:
  skip_korean_public_holidays: true
  # 공공데이터포털 특일 정보 API 결과에 임시공휴일/대체공휴일 보정이 필요할 때만 추가합니다.
  korean_public_holiday_overrides: {}

analysis:
  model: claude
  summary_language: ko
  score_fields:
    - policy_impact
    - officiality
    - korea_relevance
    - urgency
  top_n_for_digest: 5

telegram:
  send_enabled: true
  review_send_enabled: true
  digest_send_enabled: true
  max_messages: 20
  timeout_seconds: 10

notion:
  publish_enabled: true
  review_publish_enabled: true
  dashboard_enabled: true
  page_title_prefix: "IP 동향 전체 분석결과"
  review_page_title_prefix: "IP Monitor 수집 검증 목록"
  dashboard_title: "IP Monitor 운영 대시보드"
  max_items: 80

